databases:
  - name: business-card-db
    databaseName: business_card
    user: postgres
    plan: free

services:
  - type: web
    name: digital-business-card
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: business-card-db
          property: connectionString
